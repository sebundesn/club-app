name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: build
        run: go build ./...

      # 「fmt.Errorf("...: w", err)」のような書式ミスを自動で見つける
      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
